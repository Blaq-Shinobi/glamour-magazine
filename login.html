<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | GLAMOUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } } } </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        .field-input { width: 100%; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 2px; font-size: 0.95rem; margin-bottom: 1rem; background: white; }
        .dark .field-input { background: #1e1e1e; border-color: #374151; color: #f3f4f6; }
        .field-input:focus { outline: none; border-color: #db2777; }
    </style>
</head>
<body class="bg-white text-gray-900 dark:bg-[#121212] dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col">

    <header class="border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex justify-center">
            <a href="index.html" class="flex items-baseline gap-1"><span class="serif text-2xl font-bold tracking-tighter text-black dark:text-white">GLAMOUR<span class="font-black">+</span></span><span class="text-[9px] font-bold uppercase tracking-widest text-pink-600 dark:text-pink-400 whitespace-nowrap">West Africa</span></a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-sm">

            <div id="config-missing" class="hidden text-center">
                <h1 class="serif text-2xl font-bold mb-3">Supabase isn't configured yet</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400">Fill in <code class="px-1 py-0.5 bg-gray-100 dark:bg-gray-800 rounded-sm">js/supabase-config.js</code> with your project URL and anon key.</p>
            </div>

            <div id="auth-box">
                <h1 id="page-title" class="serif text-3xl font-bold text-center mb-8">Log In</h1>

                <div id="login-view">
                    <input type="email" id="login-email" placeholder="Email" class="field-input">
                    <input type="password" id="login-pass" placeholder="Password" class="field-input">
                    <button id="login-btn" class="w-full bg-black dark:bg-white text-white dark:text-black px-6 py-3 text-sm font-bold uppercase tracking-wider hover:bg-gray-800 dark:hover:bg-gray-200 transition rounded-sm">Log In</button>
                    <p class="text-center mt-5 text-sm text-gray-500 dark:text-gray-400">No account? <button id="show-signup-btn" class="text-pink-600 dark:text-pink-400 font-semibold hover:underline">Sign up</button></p>
                </div>

                <div id="signup-view" class="hidden">
                    <input type="email" id="signup-email" placeholder="Email" class="field-input">
                    <input type="password" id="signup-pass" placeholder="Password (min 6 characters)" class="field-input">
                    <button id="signup-btn" class="w-full bg-pink-600 text-white px-6 py-3 text-sm font-bold uppercase tracking-wider hover:bg-pink-700 transition rounded-sm">Create Account</button>
                    <p class="text-center mt-5 text-sm text-gray-500 dark:text-gray-400">Have an account? <button id="show-login-btn" class="text-pink-600 dark:text-pink-400 font-semibold hover:underline">Log in</button></p>
                </div>

                <p id="message" class="text-center mt-5 text-sm font-semibold"></p>
            </div>

            <p class="text-center mt-10"><a href="index.html" class="text-sm text-gray-400 hover:text-pink-600 dark:hover:text-pink-400">&larr; Back to GLAMOUR</a></p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        if (!supabaseClient) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('config-missing').classList.remove('hidden');
        }

        const loginView = document.getElementById('login-view');
        const signupView = document.getElementById('signup-view');
        const pageTitle = document.getElementById('page-title');
        const messageEl = document.getElementById('message');

        function setMessage(text, kind) {
            messageEl.textContent = text;
            messageEl.className = 'text-center mt-5 text-sm font-semibold ' +
                (kind === 'error' ? 'text-red-600 dark:text-red-400'
                 : kind === 'success' ? 'text-green-600 dark:text-green-400'
                 : 'text-gray-500 dark:text-gray-400');
        }

        document.getElementById('show-signup-btn').addEventListener('click', () => {
            loginView.classList.add('hidden');
            signupView.classList.remove('hidden');
            pageTitle.textContent = 'Sign Up';
            setMessage('', null);
        });

        document.getElementById('show-login-btn').addEventListener('click', () => {
            signupView.classList.add('hidden');
            loginView.classList.remove('hidden');
            pageTitle.textContent = 'Log In';
            setMessage('', null);
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            setMessage('Logging in...', null);
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                setMessage(error.message, 'error');
            } else {
                setMessage('Success! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 800);
            }
        });

        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-pass').value;
            setMessage('Creating account...', null);
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                setMessage(error.message, 'error');
            } else {
                setMessage('Account created! You can now log in. If you\'re meant to be an admin, ask the site owner to add you in Supabase.', 'success');
                setTimeout(() => document.getElementById('show-login-btn').click(), 3000);
            }
        });
    </script>
</body>
</html>
