<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | GLAMOUR+ West Africa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } } } </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } h1, h2, h3, h4, .serif { font-family: 'Playfair Display', serif; } </style>
</head>
<body class="bg-white text-gray-900 dark:bg-[#121212] dark:text-gray-100 transition-colors duration-300">
    <header class="border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex justify-center">
            <a href="index.html" class="flex items-baseline gap-1"><span class="serif text-2xl font-bold tracking-tighter text-black dark:text-white">GLAMOUR<span class="font-black">+</span></span><span class="text-[9px] font-bold uppercase tracking-widest text-pink-600 dark:text-pink-400 whitespace-nowrap">West Africa</span></a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="text-center mb-14">
            <h1 class="serif text-4xl md:text-5xl font-bold mb-4 text-black dark:text-white">Books</h1>
            <p class="text-lg text-gray-600 dark:text-gray-400 max-w-xl mx-auto">Our PDF titles, available now.</p>
        </div>

        <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        <p id="books-empty" class="hidden text-center text-gray-400 py-16">No books available right now — check back soon.</p>

        <p class="text-center mt-16"><a href="index.html" class="text-sm text-gray-400 hover:text-pink-600 dark:hover:text-pink-400">&larr; Back to GLAMOUR+</a></p>
    </main>

    <footer class="bg-black text-white py-12 dark:bg-[#0a0a0a]"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center"><h4 class="serif text-2xl font-bold mb-6">GLAMOUR</h4><p class="text-xs text-gray-500">&copy; 2026 Glamour+ West Africa. All rights reserved.</p></div></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        async function renderBooks() {
            const grid = document.getElementById('books-grid');
            const empty = document.getElementById('books-empty');
            if (!supabaseClient) { empty.classList.remove('hidden'); return; }
            const { data, error } = await supabaseClient.from('books').select('*').eq('active', true).order('sort_order', { ascending: true });
            if (error || !data || data.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            grid.innerHTML = data.map(book => {
                const cover = book.cover_image || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80';
                const buyBtn = book.buy_link
                    ? `<a href="${escapeHtml(book.buy_link)}" target="_blank" rel="noopener" class="block text-center bg-black dark:bg-white text-white dark:text-black px-4 py-2.5 text-sm font-bold uppercase tracking-wider hover:bg-gray-800 dark:hover:bg-gray-200 transition rounded-sm">Buy Now</a>`
                    : `<span class="block text-center text-sm text-gray-400 py-2.5">Coming soon</span>`;
                return `<div class="border border-gray-200 dark:border-gray-800 rounded-sm overflow-hidden flex flex-col">
                    <img src="${escapeHtml(cover)}" alt="${escapeHtml(book.title)}" class="w-full h-64 object-cover bg-gray-100 dark:bg-gray-900">
                    <div class="p-5 flex flex-col flex-1">
                        <h3 class="serif text-xl font-bold mb-1 text-black dark:text-white">${escapeHtml(book.title)}</h3>
                        <p class="text-pink-600 dark:text-pink-400 font-bold text-sm mb-3">${escapeHtml(book.price_display || '')}</p>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-5 flex-1">${escapeHtml(book.description || '')}</p>
                        ${buyBtn}
                    </div>
                </div>`;
            }).join('');
        }
        renderBooks();
    </script>
</body>
</html>
